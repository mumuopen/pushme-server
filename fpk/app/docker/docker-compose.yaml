version: "3.8"

services:
  pushme-server:
    image: mumuquant/pushme-server-rs:latest
    container_name: pushme-server
    restart: unless-stopped
    ports:
      - "${wizard_panel_port}:3010"
      - "${wizard_service_port}:3100"
    volumes:
      - "${TRIM_DATA_SHARE_PATHS}/config:/app/config"
    environment:
      - TZ=${TZ:-Asia/Shanghai}